<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A2A1A"/>
      <stop offset="100%" stop-color="#120B05"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="40%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#4A3000"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFEA00"/>
      <stop offset="60%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FF1E00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Back Light Aura -->
  <circle cx="300" cy="300" r="180" fill="#FF9100" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Buddha Silhouette & Body -->
  <!-- Base Lotus -->
  <path d="M160,460 C200,420 400,420 440,460 C460,500 140,500 160,460 Z" fill="url(#bronze)"/>
  
  <!-- Meditating Body -->
  <path d="M200,450 C180,380 230,300 250,260 C270,240 330,240 350,260 C370,300 420,380 400,450 Z" fill="url(#bronze)"/>
  
  <!-- Shoulders & Robe -->
  <path d="M220,340 Q300,320 380,340 Q360,440 240,440 Z" fill="#8B6914" opacity="0.6"/>
  
  <!-- Head & Ushnisha -->
  <circle cx="300" cy="190" r="42" fill="url(#bronze)"/>
  <path d="M285,150 Q300,120 315,150 Z" fill="url(#bronze)"/>
  
  <!-- Face details -->
  <path d="M285,195 Q300,205 315,195" stroke="#4A3000" stroke-width="3" fill="none"/>
  
  <!-- T-Light Lotus Bowl in Hands -->
  <ellipse cx="300" cy="380" rx="45" ry="20" fill="url(#bronze)"/>
  <ellipse cx="300" cy="375" rx="35" ry="12" fill="#222"/>
  
  <!-- Candle Flame -->
  <path d="M300,340 C290,360 310,360 300,340 Z" fill="url(#flame)" filter="url(#glow)"/>
  <ellipse cx="300" cy="375" rx="20" ry="6" fill="#FFAB00" opacity="0.8"/>

  <!-- Product Label Pill -->
  <rect x="30" y="30" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="140" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFD700" text-anchor="middle" letter-spacing="1">NOOR BUDDHA T-LIGHT</text>
</svg>