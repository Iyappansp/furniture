<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D260F"/>
      <stop offset="100%" stop-color="#140A02"/>
    </radialGradient>
    <linearGradient id="ganeshaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#8B572A"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Glowing Golden Halo -->
  <circle cx="300" cy="240" r="160" fill="url(#halo)"/>
  
  <!-- Tiered Rock Basin -->
  <path d="M140,460 Q300,530 460,460 Q500,400 440,360 Q300,340 160,360 Q100,400 140,460 Z" fill="#4A3B32"/>
  <ellipse cx="300" cy="420" rx="150" ry="40" fill="#1B4965"/>
  
  <!-- Lord Ganesha Figurine -->
  <!-- Seated Body -->
  <ellipse cx="300" cy="340" rx="75" ry="55" fill="url(#ganeshaGold)"/>
  
  <!-- Head & Elephant Ears -->
  <circle cx="300" cy="220" r="50" fill="url(#ganeshaGold)"/>
  <!-- Left Ear -->
  <path d="M250,200 C190,170 190,260 250,250 Z" fill="url(#ganeshaGold)"/>
  <!-- Right Ear -->
  <path d="M350,200 C410,170 410,260 350,250 Z" fill="url(#ganeshaGold)"/>
  
  <!-- Trunk Curve -->
  <path d="M300,230 Q330,270 290,300 C270,310 260,290 280,275 Z" fill="url(#ganeshaGold)"/>
  
  <!-- Crown / Mukut -->
  <path d="M270,180 L300,100 L330,180 Z" fill="#FFD700"/>
  <circle cx="300" cy="140" r="10" fill="#E60000"/>
  
  <!-- Rotating Crystal Sphere -->
  <circle cx="300" cy="380" r="24" fill="#E0F7FA" opacity="0.95"/>
  <circle cx="300" cy="380" r="18" fill="#FFF" opacity="0.6"/>

  <!-- Product Label Pill -->
  <rect x="30" y="30" width="240" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="150" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFD700" text-anchor="middle" letter-spacing="1">ALPINE GANESHA FOUNTAIN</text>
</svg>