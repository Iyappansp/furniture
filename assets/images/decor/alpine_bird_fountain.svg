<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22332A"/>
      <stop offset="100%" stop-color="#0D1612"/>
    </radialGradient>
    <linearGradient id="stone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A9A86"/>
      <stop offset="50%" stop-color="#556652"/>
      <stop offset="100%" stop-color="#2F3B2C"/>
    </linearGradient>
    <radialGradient id="waterPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ECCD3" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#1A508B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#071E3D"/>
    </radialGradient>
    <linearGradient id="feather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD369"/>
      <stop offset="100%" stop-color="#F76B1C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Base Rock Basin -->
  <path d="M120,440 Q300,540 480,440 Q520,360 460,300 Q300,260 140,300 Q80,360 120,440 Z" fill="url(#stone)" filter="url(#shadow)"/>
  
  <!-- Water Surface -->
  <ellipse cx="300" cy="380" rx="160" ry="70" fill="url(#waterPool)"/>
  
  <!-- Water Ripples -->
  <ellipse cx="300" cy="380" rx="120" ry="50" fill="none" stroke="#A8E6CF" stroke-width="2" opacity="0.6"/>
  <ellipse cx="300" cy="380" rx="70" ry="28" fill="none" stroke="#A8E6CF" stroke-width="3" opacity="0.8"/>
  
  <!-- Upper Tier Rock -->
  <path d="M200,280 Q300,230 400,280 Q430,220 370,180 Q300,160 230,180 Q170,220 200,280 Z" fill="url(#stone)" filter="url(#shadow)"/>
  <ellipse cx="300" cy="220" rx="70" ry="25" fill="url(#waterPool)"/>
  
  <!-- Water Cascade Stream -->
  <path d="M290,230 Q285,300 295,380" stroke="#E8F9FD" stroke-width="8" fill="none" opacity="0.85"/>
  <path d="M310,230 Q315,300 305,380" stroke="#FFF" stroke-width="5" fill="none" opacity="0.9"/>
  
  <!-- Birds -->
  <!-- Bird 1 -->
  <g transform="translate(370, 160)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#feather)"/>
    <circle cx="12" cy="-6" r="8" fill="url(#feather)"/>
    <polygon points="18,-6 25,-4 18,-2" fill="#333"/>
    <circle cx="14" cy="-8" r="1.5" fill="#000"/>
    <path d="M-10,-4 Q-22,-14 -16,-2" fill="url(#feather)"/>
  </g>
  
  <!-- Bird 2 -->
  <g transform="translate(180, 260) scale(-1, 1)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="16" ry="10" fill="url(#feather)"/>
    <circle cx="10" cy="-5" r="7" fill="url(#feather)"/>
    <polygon points="15,-5 22,-3 15,-1" fill="#333"/>
    <circle cx="12" cy="-7" r="1.5" fill="#000"/>
  </g>

  <!-- Product Label Pill -->
  <rect x="30" y="30" width="210" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="135" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#4ECCD3" text-anchor="middle" letter-spacing="1">ALPINE BIRD FOUNTAIN</text>
</svg>