<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#302B27"/>
      <stop offset="100%" stop-color="#14110F"/>
    </radialGradient>
    <linearGradient id="porcelain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#E2DCD5"/>
    </linearGradient>
    <linearGradient id="roseEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#E8A7B8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Wooden Table Surface -->
  <rect x="100" y="490" width="400" height="30" rx="6" fill="#4A3525" filter="url(#shadow)"/>
  
  <!-- Sitting Rabbit Body -->
  <!-- Tail -->
  <circle cx="190" cy="440" r="22" fill="url(#porcelain)"/>
  
  <!-- Main Body -->
  <ellipse cx="280" cy="420" rx="95" ry="70" fill="url(#porcelain)" filter="url(#shadow)"/>
  
  <!-- Head -->
  <circle cx="370" cy="300" r="50" fill="url(#porcelain)"/>
  <ellipse cx="395" cy="315" rx="20" ry="14" fill="url(#porcelain)"/>
  
  <!-- Ears -->
  <path d="M350,260 C330,140 370,100 380,120 C390,140 370,240 365,265 Z" fill="url(#porcelain)" filter="url(#shadow)"/>
  <path d="M355,250 C342,150 370,120 376,135 Z" fill="url(#roseEar)"/>
  
  <path d="M375,260 C375,140 415,110 425,130 C435,150 395,240 388,265 Z" fill="url(#porcelain)" filter="url(#shadow)"/>
  <path d="M380,250 C382,150 410,128 418,142 Z" fill="url(#roseEar)"/>
  
  <!-- Cute Eye & Nose -->
  <circle cx="395" cy="295" r="4" fill="#3D3028"/>
  <ellipse cx="414" cy="312" rx="3" ry="2.5" fill="#FFB7C5"/>

  <!-- Product Label Pill -->
  <rect x="30" y="30" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="140" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFD1DC" text-anchor="middle" letter-spacing="1">BRIGHTON RABBIT</text>
</svg>