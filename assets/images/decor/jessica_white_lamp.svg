<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </radialGradient>
    <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFF9E6"/>
      <stop offset="80%" stop-color="#FFE8B3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whiteMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6D6D6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Soft Ambient Globe Aura -->
  <circle cx="300" cy="180" r="140" fill="url(#globeGlow)"/>
  
  <!-- Base -->
  <ellipse cx="300" cy="530" rx="110" ry="20" fill="url(#whiteMetal)"/>
  
  <!-- Slender White Metal Stem -->
  <rect x="295" y="180" width="10" height="350" fill="url(#whiteMetal)"/>
  
  <!-- Glowing Opal Glass Sphere Shade -->
  <circle cx="300" cy="180" r="55" fill="#FFFFFF"/>
  <circle cx="285" cy="165" r="45" fill="#FFFDF5" opacity="0.9"/>

  <!-- Product Label Pill -->
  <rect x="30" y="30" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="140" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">JESSICA WHITE LAMP</text>
</svg>