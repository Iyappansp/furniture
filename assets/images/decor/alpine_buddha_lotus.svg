<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B2A32"/>
      <stop offset="100%" stop-color="#091014"/>
    </radialGradient>
    <linearGradient id="lotusPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF94B9"/>
      <stop offset="100%" stop-color="#C23B68"/>
    </linearGradient>
    <linearGradient id="stoneGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AA6B2"/>
      <stop offset="100%" stop-color="#3B444B"/>
    </linearGradient>
    <radialGradient id="waterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFF0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#006699" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Outer Pool -->
  <ellipse cx="300" cy="460" rx="200" ry="70" fill="url(#stoneGrey)"/>
  <ellipse cx="300" cy="455" rx="185" ry="60" fill="url(#waterGlow)"/>
  
  <!-- Lotus Petals Base -->
  <path d="M180,430 C220,370 280,410 300,450 C320,410 380,370 420,430 Z" fill="url(#lotusPink)"/>
  <path d="M220,450 C260,390 300,420 300,460 C300,420 340,390 380,450 Z" fill="#FFB7D2"/>
  
  <!-- Seated Buddha Stone -->
  <path d="M230,420 C220,360 260,280 280,240 C290,220 310,220 320,240 C340,280 380,360 370,420 Z" fill="url(#stoneGrey)"/>
  <circle cx="300" cy="190" r="35" fill="url(#stoneGrey)"/>
  <path d="M288,160 Q300,135 312,160 Z" fill="url(#stoneGrey)"/>
  
  <!-- Glowing Water Bubbles & Cascade -->
  <circle cx="300" cy="455" r="30" fill="#FFF" opacity="0.6"/>
  <path d="M300,240 L300,450" stroke="#80FFFF" stroke-width="4" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- Product Label Pill -->
  <rect x="30" y="30" width="240" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="150" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FF94B9" text-anchor="middle" letter-spacing="1">ALPINE BUDDHA LOTUS</text>
</svg>