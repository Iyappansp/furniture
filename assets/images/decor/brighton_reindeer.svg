<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C3539"/>
      <stop offset="100%" stop-color="#111518"/>
    </radialGradient>
    <linearGradient id="ceramicWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F0ECE1"/>
      <stop offset="100%" stop-color="#D8D2C2"/>
    </linearGradient>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7CE"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Wooden Pedestal Base -->
  <rect x="180" y="500" width="240" height="30" rx="6" fill="#3D2314" filter="url(#shadow)"/>
  
  <!-- Reindeer Body -->
  <!-- Legs -->
  <rect x="230" y="380" width="16" height="125" rx="8" fill="url(#ceramicWhite)"/>
  <rect x="265" y="380" width="14" height="125" rx="7" fill="#C5BFB0"/>
  <rect x="330" y="380" width="16" height="125" rx="8" fill="url(#ceramicWhite)"/>
  <rect x="360" y="380" width="14" height="125" rx="7" fill="#C5BFB0"/>
  
  <!-- Main Body -->
  <ellipse cx="300" cy="360" rx="90" ry="50" fill="url(#ceramicWhite)" filter="url(#shadow)"/>
  
  <!-- Neck & Head -->
  <path d="M230,340 C210,260 250,200 270,180 C280,170 300,180 300,200 C290,240 280,320 280,340 Z" fill="url(#ceramicWhite)"/>
  <ellipse cx="280" cy="180" rx="25" ry="16" fill="url(#ceramicWhite)"/>
  
  <!-- Metallic Gold Antlers -->
  <path d="M275,170 C260,110 220,90 200,80 M245,120 C230,130 210,120 200,110 M255,100 Q230,70 240,50" stroke="url(#champagneGold)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
  <path d="M285,170 C300,110 340,90 360,80 M300,120 C315,130 335,120 345,110 M290,100 Q315,70 305,50" stroke="url(#champagneGold)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#shadow)"/>

  <!-- Product Label Pill -->
  <rect x="30" y="30" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="140" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E5C158" text-anchor="middle" letter-spacing="1">BRIGHTON REINDEER</text>
</svg>