<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#362925"/>
      <stop offset="100%" stop-color="#140D0B"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFF0"/>
      <stop offset="100%" stop-color="#EAE6DF"/>
    </linearGradient>
    <linearGradient id="goldDeco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEABB"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Pedestal -->
  <rect x="80" y="480" width="440" height="35" rx="8" fill="url(#ivory)" filter="url(#shadow)"/>
  <rect x="100" y="475" width="400" height="8" fill="url(#goldDeco)"/>
  
  <!-- Mother Elephant (Right) -->
  <g transform="translate(180, 180)" filter="url(#shadow)">
    <!-- Legs -->
    <rect x="60" y="180" width="30" height="120" rx="10" fill="url(#goldDeco)"/>
    <rect x="120" y="180" width="30" height="120" rx="10" fill="url(#goldDeco)"/>
    <rect x="180" y="180" width="30" height="120" rx="10" fill="url(#goldDeco)"/>
    
    <!-- Body -->
    <ellipse cx="140" cy="160" rx="110" ry="80" fill="url(#goldDeco)"/>
    
    <!-- Ornate Blanket -->
    <path d="M70,140 Q140,200 210,140 Z" fill="#8B0000"/>
    <path d="M80,150 Q140,205 200,150 Z" fill="url(#ivory)"/>
    
    <!-- Head & Raised Trunk -->
    <circle cx="240" cy="110" r="50" fill="url(#goldDeco)"/>
    <path d="M260,110 Q320,60 300,10 C290,0 270,30 270,60 Z" fill="url(#goldDeco)"/>
    
    <!-- Tusk -->
    <path d="M270,120 Q310,125 320,110 Q300,135 265,130 Z" fill="url(#ivory)"/>
    
    <!-- Ear -->
    <ellipse cx="210" cy="110" rx="35" ry="45" fill="#AA771C"/>
  </g>
  
  <!-- Baby Elephant (Left) -->
  <g transform="translate(60, 270) scale(0.65)" filter="url(#shadow)">
    <rect x="60" y="180" width="30" height="120" rx="10" fill="url(#goldDeco)"/>
    <rect x="180" y="180" width="30" height="120" rx="10" fill="url(#goldDeco)"/>
    <ellipse cx="140" cy="160" rx="100" ry="70" fill="url(#goldDeco)"/>
    <circle cx="230" cy="110" r="45" fill="url(#goldDeco)"/>
    <path d="M250,110 Q300,70 280,20 Z" fill="url(#goldDeco)"/>
  </g>

  <!-- Product Label Pill -->
  <rect x="30" y="30" width="220" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="140" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#C5A059" text-anchor="middle" letter-spacing="1">CORSICA ELEPHANTS</text>
</svg>