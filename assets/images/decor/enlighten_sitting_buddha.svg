<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E2319"/>
      <stop offset="100%" stop-color="#0E0A07"/>
    </radialGradient>
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D068"/>
      <stop offset="50%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#3D2906"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Rays of Light -->
  <g opacity="0.15" stroke="#FFD700" stroke-width="3">
    <line x1="300" y1="200" x2="50" y2="50"/>
    <line x1="300" y1="200" x2="550" y2="50"/>
    <line x1="300" y1="200" x2="50" y2="400"/>
    <line x1="300" y1="200" x2="550" y2="400"/>
  </g>
  
  <!-- Lotus Pedestal -->
  <path d="M140,480 C200,430 400,430 460,480 C480,530 120,530 140,480 Z" fill="url(#antiqueGold)"/>
  
  <!-- Sitting Meditating Body (Dhyana Mudra) -->
  <path d="M180,460 C160,370 230,280 250,240 C270,220 330,220 350,240 C370,280 440,370 420,460 Z" fill="url(#antiqueGold)"/>
  
  <!-- Hands Resting in Lap -->
  <ellipse cx="300" cy="420" rx="50" ry="20" fill="#AA771C"/>
  
  <!-- Head & Hair Knots -->
  <circle cx="300" cy="180" r="45" fill="url(#antiqueGold)"/>
  <circle cx="300" cy="130" r="12" fill="url(#antiqueGold)"/>
  
  <!-- Facial Serenity -->
  <path d="M285,185 Q300,195 315,185" stroke="#3D2906" stroke-width="3" fill="none"/>
  
  <!-- Product Label Pill -->
  <rect x="30" y="30" width="240" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="150" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F4D068" text-anchor="middle" letter-spacing="1">ENLIGHTEN SITTING BUDDHA</text>
</svg>