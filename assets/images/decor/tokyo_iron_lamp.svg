<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFA500" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A"/>
      <stop offset="50%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEABB"/>
      <stop offset="100%" stop-color="#F8B500"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Spotlight Cone -->
  <polygon points="300,160 100,560 500,560" fill="url(#lampGlow)"/>
  
  <!-- Base -->
  <ellipse cx="300" cy="540" rx="140" ry="25" fill="url(#metal)" filter="url(#shadow)"/>
  <ellipse cx="300" cy="535" rx="130" ry="20" fill="#1A1A1A"/>
  
  <!-- Stem -->
  <path d="M300,535 L300,220 C300,160 320,120 380,120 L400,120" stroke="url(#metal)" stroke-width="14" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  
  <!-- Joint Accent -->
  <circle cx="380" cy="120" r="10" fill="url(#gold)"/>
  
  <!-- Movable Shade -->
  <g filter="url(#shadow)">
    <path d="M340,140 C340,170 420,170 420,140 L400,120 L360,120 Z" fill="url(#metal)"/>
    <ellipse cx="380" cy="155" rx="40" ry="12" fill="url(#gold)"/>
    <ellipse cx="380" cy="155" rx="32" ry="8" fill="#FFF8E7" opacity="0.95"/>
  </g>
  
  <!-- Product Label Pill -->
  <rect x="30" y="30" width="180" height="36" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="120" y="53" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E5C158" text-anchor="middle" letter-spacing="1">TOKYO IRON LAMP</text>
</svg>