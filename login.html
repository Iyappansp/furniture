   <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login | VerdantWood & Co.</title>
<meta name="description" content="Log in to your VerdantWood & Co. account to track custom furniture orders, request design quotes, and view saved collections.">
<link rel="icon" type="image/png" href="assets/fav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/dark-mode.css">
<link rel="stylesheet" href="assets/css/rtl.css">
<link rel="stylesheet" href="assets/css/interactions.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<style>
  .auth-section {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), url('assets/images/auth_bg.png') no-repeat center center / cover;
  }
  .auth-card {
    width: 100%;
    max-width: 480px;
    background: var(--surface-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 3rem 2.5rem;
    box-shadow: var(--shadow-lift);
    text-align: center;
    transition: transform var(--t-med) var(--ease);
  }
  .auth-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 2rem;
  }
  .auth-logo-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid var(--color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-primary);
  }
  .auth-logo-text {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--color-dark);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .auth-logo-text span {
    color: var(--color-primary);
  }
  .auth-title {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-dark);
    margin-bottom: 0.5rem;
  }
  .auth-subtitle {
    font-size: 0.92rem;
    color: var(--color-text-muted);
    margin-bottom: 2.2rem;
    line-height: 1.5;
  }
  .auth-form {
    text-align: left;
  }
  .auth-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.88rem;
    margin-bottom: 1.8rem;
  }
  .auth-checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    color: var(--color-text);
  }
  .auth-checkbox input {
    accent-color: var(--color-primary);
    width: 16px;
    height: 16px;
  }
  .auth-forgot {
    color: var(--color-primary);
    font-weight: 500;
    transition: color var(--t-fast);
  }
  .auth-forgot:hover {
    color: var(--color-primary-dark);
    text-decoration: underline;
  }
  .btn-auth-submit {
    width: 100%;
    padding: 1rem;
    background: var(--color-secondary);
    color: var(--color-text);
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-button);
    font-weight: 600;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all var(--t-fast);
  }
  .btn-auth-submit:hover {
    background: var(--color-primary);
    color: #fff;
  }
  .auth-footer-link {
    display: block;
    margin-top: 1.8rem;
    font-size: 0.9rem;
    color: var(--color-text-muted);
    text-align: center;
  }
  .auth-footer-link a {
    color: var(--color-primary);
    font-weight: 600;
  }
  .auth-footer-link a:hover {
    text-decoration: underline;
  }
  .password-field-wrapper {
    position: relative;
  }
  .password-toggle-btn {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .password-toggle-btn svg {
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>

<div class="preloader"><div class="preloader-logo">VerdantWood</div></div>


<main>
  <section class="auth-section">
    <div class="auth-card" data-reveal="scale">
      <a href="index.html" class="logo" style="margin-bottom: 2rem; justify-content: center;">
        <img src="assets/logo1.png" alt="VerdantWood &amp; Co. Logo">
      </a>
      
      <h1 class="auth-title">Customer Login</h1>
      <p class="auth-subtitle">Log in to your account to manage designs, request quotes, and track custom furniture orders.</p>
      
      <form class="auth-form" action="#" method="POST" onsubmit="event.preventDefault(); alert('Login request received! (Demo Mode)');">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-eye-off"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>
        
        <div class="auth-options">
          <label class="auth-checkbox">
            <input type="checkbox">
            <span>Remember Me</span>
          </label>
          <a href="#" class="auth-forgot">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn-auth-submit">Sign In</button>
        
        <div class="or-divider">Or connect via</div>
        
        <div class="social-login">
          <button type="button" class="social-btn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            <span>Google</span>
          </button>
          <button type="button" class="social-btn">
            <svg viewBox="0 0 24 24" fill="#1877F2" width="20" height="20"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            <span>Facebook</span>
          </button>
          <button type="button" class="social-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" width="20" height="20"><path d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282"/></svg>
            <span>Apple</span>
          </button>
        </div>
        
        <span class="auth-footer-link">Don't have an account? <a href="signup.html">Sign Up</a></span>
      </form>
    </div>
  </section>
</main>


<script src="assets/js/main.js"></script>
<script src="assets/js/animations.js"></script>
<script>
  // Simple password toggle logic
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.querySelector('.password-toggle-btn');
  toggleBtn.addEventListener('click', () => {
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    } else {
      passwordInput.type = 'password';
      toggleBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-eye-off"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    }
  });
</script>
</body>
</html>
